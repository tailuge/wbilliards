name: Build Android TWA

# Manual trigger only. The APK/AAB is a thin TWA shell that loads the deployed
# PWA live, so nothing from the billiards repo needs to be pulled or rebuilt on
# web content changes. Rebuild only when twa-manifest.json changes (icons/name/
# start URL) or when cutting a new Play release (appVersionCode bump).
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    # Least privilege: the token is only used by checkout. Secrets are real
    # only as runner env vars - never committed - so a public repo is fine.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.TWA_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::TWA_KEYSTORE_B64 secret not set - run the one-time bootstrap first (see README)"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > android.keystore

      # Each `docker run` starts from a fresh image whose Android SDK licenses
      # are not accepted, so gradle/bubblewrap cannot auto-install the missing
      # build-tools/platforms. Accept licenses in the SAME container invocation
      # that regenerates and builds (license files live in the container's
      # filesystem and would be lost by a separate `docker run`).
      - name: Regenerate project and build signed APK + AAB
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.TWA_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.TWA_KEY_PASSWORD }}
        run: >-
          docker run --rm
          -v "$(pwd)":/app -w /app
          -e BUBBLEWRAP_KEYSTORE_PASSWORD="$BUBBLEWRAP_KEYSTORE_PASSWORD"
          -e BUBBLEWRAP_KEY_PASSWORD="$BUBBLEWRAP_KEY_PASSWORD"
          --entrypoint sh
          ghcr.io/googlechromelabs/bubblewrap:latest
          -c '
            set -e
            SDK=/root/.bubblewrap/android_sdk
            SDKM=$(find "$SDK" -type f -name sdkmanager 2>/dev/null | head -n1)
            yes | "$SDKM" --sdk_root="$SDK" --licenses >/dev/null
            bubblewrap update --skipVersionUpgrade
            bubblewrap build --signingKeyPath=android.keystore
          '

      # assetlinks.json (package name + SHA-256 fingerprint) is what you copy into
      # the billiards repo at dist/.well-known/assetlinks.json.
      - name: Generate assetlinks.json
        run: >-
          docker run --rm
          -v "$(pwd)":/app -w /app
          ghcr.io/googlechromelabs/bubblewrap:latest
          fingerprint generateAssetLinks --output=assetlinks.json

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: twa-release
          path: |
            app-release-signed.apk
            app-release-bundle.aab
            assetlinks.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ inputs.release_tag }}
          files: |
            app-release-signed.apk
            app-release-bundle.aab
            assetlinks.json
          draft: false
          prerelease: false
